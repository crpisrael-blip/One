name = "one-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "one-db"
database_id = "" # יוגדר לאחר יצירת ה-DB

# R2 Storage
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "one-storage"

# KV Namespace (Configuration cache)
# [[kv_namespaces]]
# binding = "CONFIG_KV"
# id = ""

[vars]
ENVIRONMENT = "development"
APP_NAME = "ONE Platform"

# Secrets (set via `wrangler secret put`):
# JWT_SECRET
# ADMIN_EMAIL
